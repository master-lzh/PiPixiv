name: Dev Builds
on:
  push:
    branches:
      - develop
      - 'feature/**'
  workflow_dispatch:
    inputs:
      name:
        description: "Dev-Build"
        default: "Generate dev build"
      windowsArtifactRunId:
        description: "Existing run ID for Windows startup only; leave empty to build all platforms"
        type: string
        default: ""

jobs:
  android-foss:
    if: ${{ inputs.windowsArtifactRunId == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > pipixiv.jks

      - name: Build Foss Release apk
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          sed -i -e '/firebase/d' -e '/google.services/d' {.,app}/build.gradle.kts
          sed -i '/foojay/d' settings.gradle.kts
          ./gradlew assembleRelease -PapplyFirebasePlugins=false -Pdebug=false --stacktrace

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-foss-apk
          path: |
            app/release/foss/*.apk

  android-default:
    if: ${{ inputs.windowsArtifactRunId == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > pipixiv.jks

      - name: Add Google Services
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $GOOGLE_SERVICE_JSON > app/google-services.json

      - name: Build Default Release apk
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          ./gradlew assembleRelease -PapplyFirebasePlugins=true -Pdebug=false --stacktrace

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-default-apk
          path: |
            app/release/default/*.apk

  desktop-linux:
    if: ${{ inputs.windowsArtifactRunId == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'gradle'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Sentry CLI
        run: python .github/scripts/setup-sentry-cli.py

      - name: Build Linux Distributions
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: pipixiv
          SENTRY_PROJECT: pipixiv
        run: ./gradlew :composeApp:createReleaseDistributable :composeApp:uploadDesktopSentryMapping -Pdebug=false

      - name: Save desktop Sentry mapping
        if: ${{ always() && hashFiles('composeApp/build/compose/binaries/main-release/proguard/mapping.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-sentry-mapping
          if-no-files-found: error
          path: |
            composeApp/build/compose/binaries/main-release/proguard/mapping.txt
            composeApp/build/compose/binaries/main-release/proguard/sentry-debug-meta.properties

      - name: Package Linux Distribution
        run: |
          cd composeApp/build/compose/binaries/main-release
          tar -czf PiPixiv-linux-x86_64.tar.gz -C app .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: composeApp/build/compose/binaries/main-release/PiPixiv-linux-x86_64.tar.gz

  desktop-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'gradle'

      - name: Set up gradle
        if: ${{ inputs.windowsArtifactRunId == '' }}
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Sentry CLI
        if: ${{ inputs.windowsArtifactRunId == '' }}
        run: python .github/scripts/setup-sentry-cli.py

      - name: Build Windows Distribution
        if: ${{ inputs.windowsArtifactRunId == '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: pipixiv
          SENTRY_PROJECT: pipixiv
        run: ./gradlew packageReleaseMsi :composeApp:uploadDesktopSentryMapping -Pdebug=false

      - name: Save desktop Sentry mapping
        if: ${{ always() && inputs.windowsArtifactRunId == '' && hashFiles('composeApp/build/compose/binaries/main-release/proguard/mapping.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-sentry-mapping
          if-no-files-found: error
          path: |
            composeApp/build/compose/binaries/main-release/proguard/mapping.txt
            composeApp/build/compose/binaries/main-release/proguard/sentry-debug-meta.properties

      - name: Download Windows MSI for startup verification
        if: ${{ inputs.windowsArtifactRunId != '' }}
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          run-id: ${{ inputs.windowsArtifactRunId }}
          github-token: ${{ github.token }}
          path: composeApp/build/compose/binaries/main-release/msi

      - name: Verify Windows installation and startup
        timeout-minutes: 8
        shell: pwsh
        env:
          WINDOWS_ARTIFACT_RUN_ID: ${{ inputs.windowsArtifactRunId }}
        run: |
          $installers = @(Get-ChildItem 'composeApp/build/compose/binaries/main-release/msi/*.msi')
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows MSI" }
          $backend = if ($env:WINDOWS_ARTIFACT_RUN_ID) { 'Auto' } else { 'Tao' }
          ./.github/scripts/test-windows-startup.ps1 -MsiPath $installers[0].FullName -OutputDirectory "$env:RUNNER_TEMP/windows-startup" -ExpectedWindowBackend $backend

      - name: Upload Windows startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-startup-diagnostics
          path: ${{ runner.temp }}/windows-startup
          if-no-files-found: ignore

      - name: Upload Windows Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: ignore

  desktop-macos:
    if: ${{ inputs.windowsArtifactRunId == '' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'gradle'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Sentry CLI
        run: python .github/scripts/setup-sentry-cli.py

      - name: Build MacOS Distribution
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: pipixiv
          SENTRY_PROJECT: pipixiv
        run: ./gradlew packageReleaseDmg :composeApp:uploadDesktopSentryMapping -Pdebug=false

      - name: Save desktop Sentry mapping
        if: ${{ always() && hashFiles('composeApp/build/compose/binaries/main-release/proguard/mapping.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-sentry-mapping
          if-no-files-found: error
          path: |
            composeApp/build/compose/binaries/main-release/proguard/mapping.txt
            composeApp/build/compose/binaries/main-release/proguard/sentry-debug-meta.properties

      - name: Upload MacOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

  ios:
    if: ${{ inputs.windowsArtifactRunId == '' }}
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Resolve SwiftPM Dependencies
        working-directory: iosApp
        run: xcodebuild -resolvePackageDependencies -project PiPixiv.xcodeproj -scheme PiPixiv

      - name: Build iOS IPA
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew :composeApp:buildReleaseIpa -Pdebug=false

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-artifacts
          path: composeApp/build/archives/release/PiPixiv.ipa

  release:
    needs: [ android-foss, android-default, desktop-linux, desktop-windows, desktop-macos, ios ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Get tag name
        run: echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Rename release artifacts
        run: |
          mv artifacts/android-foss-apk/*.apk artifacts/android-foss-apk/PiPixiv-${VERSION_TAG}-android-foss.apk
          mv artifacts/android-default-apk/*.apk artifacts/android-default-apk/PiPixiv-${VERSION_TAG}-android-default.apk
          mv artifacts/linux-artifacts/PiPixiv-linux-x86_64.tar.gz artifacts/linux-artifacts/PiPixiv-${VERSION_TAG}-linux-x86_64.tar.gz
          mv artifacts/windows-artifacts/*.msi artifacts/windows-artifacts/PiPixiv-${VERSION_TAG}-windows-x86_64.msi
          mv artifacts/macos-artifacts/*.dmg artifacts/macos-artifacts/PiPixiv-${VERSION_TAG}-macos-arm64.dmg
          mv artifacts/ios-artifacts/*.ipa artifacts/ios-artifacts/PiPixiv-${VERSION_TAG}-ios.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: PiPixiv ${{ env.VERSION_TAG }}
          body: |
            Release ${{ env.VERSION_TAG }}
          draft: true
          prerelease: false
          files: |
            artifacts/android-foss-apk/**/*.apk
            artifacts/android-default-apk/**/*.apk
            artifacts/linux-artifacts/**/*.tar.gz
            artifacts/windows-artifacts/**/*.msi
            artifacts/macos-artifacts/**/*.dmg
            artifacts/ios-artifacts/*.ipa
